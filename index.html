<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصروفاتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<title>مصروفاتي</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent-text:#fff;--exp:#dc2626;--inc:#16a34a;--chip:#eef2f3;--shadow:0 1px 3px rgba(0,0,0,.06);--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#1a1f23;--text:#eceff1;--muted:#9aa5ad;--line:#2b3238;--accent:#2dd4bf;--accent-text:#04201c;--exp:#f87171;--inc:#4ade80;--chip:#252c31;--shadow:none;--danger:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 10px}
main{max-width:640px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.exp{color:var(--exp)}.inc{color:var(--inc)}
.banner{max-width:640px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:var(--chip);border:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:#fef3c7;color:#78350f;border-color:#fcd34d}
.balance .lbl{color:var(--muted);font-size:14px}
.balance .big{font-size:34px;font-weight:700;margin:2px 0 10px}
.tot{display:flex;gap:8px}
.tot>div{flex:1;background:var(--chip);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;font-size:13px}
.tot b{font-size:15px}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:disabled{opacity:.55}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;font-size:15px;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost,.ghost{background:transparent}
.btn:disabled,button:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-size:12px;text-align:center}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.panel .full{grid-column:1/-1}
.dayh{font-size:13px;color:var(--muted);margin:14px 4px 6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mid{flex:1;min-width:0}
.cat{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:400;background:var(--chip);color:var(--muted);border-radius:6px;padding:0 6px}
.note{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-size:16px;flex:none}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .btn{margin-top:10px}
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:32px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#dlgWrap{z-index:30;align-items:center;padding:20px}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.dlg{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px}
.dlg p{margin:0 0 12px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btns .btn{flex:1}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:8px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.on.e{color:var(--exp)}.seg button.on.i{color:var(--inc)}
.fld{margin-top:12px}
.fld>label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inl{display:flex;gap:8px;margin-top:8px}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:20px}
textarea{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:150px;direction:ltr;text-align:left;resize:vertical}
#toast{position:fixed;inset-inline:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;max-width:420px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
#toast button{background:transparent;border:0;color:#5eead4;font:inherit;font-weight:700;cursor:pointer}
.chartbox{margin:10px 0}
canvas{display:block;width:100%}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .nm{flex:1;min-width:0}
.bar{height:5px;border-radius:3px;background:var(--chip);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none}
.crow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.crow .nm{flex:1;min-width:0}
.btn.sm{padding:6px 10px;font-size:13px}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a{color:var(--accent);cursor:pointer;text-decoration:underline}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100vh;min-height:100dvh}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation}
.exitscreen{text-align:center}
.exitscreen p{line-height:1.8}
.calc{direction:ltr}
.cdisp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:right;margin-bottom:12px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cexp{font-size:16px;color:var(--muted);min-height:24px;overflow-x:auto;white-space:nowrap}
.cmain{font-size:44px;font-weight:600;line-height:1.2;overflow-x:auto;white-space:nowrap}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:64px;gap:10px}
.cgrid{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cgrid button{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;font-size:24px;cursor:pointer;touch-action:manipulation}
.cgrid button:active{opacity:.7}
.cgrid .op{background:var(--chip);color:var(--accent);font-weight:600}
.cgrid .fn{background:var(--chip);color:var(--muted)}
.cgrid .eq{background:var(--accent);color:var(--accent-text);border-color:var(--accent);grid-row:span 2;font-weight:700}
.cgrid .z{grid-column:span 2}
</style>
</head>
<body>
<header class="top"><h1>مصروفاتي</h1><div style="display:flex;gap:8px"><button id="undoBtn" class="btn" disabled>↶ تراجع</button><button id="exitBtn" class="btn">خروج</button></div></header>
<div id="warn" class="banner warn" hidden></div>
<div id="backupBanner" class="banner" hidden></div>

<main>
  <section id="v-tx">
    <div class="card balance">
      <div class="lbl">الرصيد الحالي</div>
      <div class="big"><span id="bal" class="num"></span></div>
      <div class="tot">
        <div><span class="muted">مصروف</span><b class="exp"><span id="tExp" class="num"></span></b></div>
        <div><span class="muted">دخل</span><b class="inc"><span id="tInc" class="num"></span></b></div>
        <div><span class="muted">صافي</span><b><span id="tNet" class="num"></span></b></div>
      </div>
      <div id="filtNote" class="muted small" style="margin-top:8px"></div>
    </div>

    <div class="searchrow">
      <input id="fSearch" type="search" placeholder="بحث في الملاحظات والأنواع...">
      <button id="fToggle" class="btn">فلاتر <span id="fBadge" class="badge" hidden></span></button>
    </div>

    <div id="fPanel" class="card panel" hidden>
      <div class="grid">
        <div><label for="fType">العملية</label><select id="fType"><option value="">الكل</option><option value="expense">مصروف</option><option value="income">دخل</option></select></div>
        <div><label for="fMethod">الدفع</label><select id="fMethod"><option value="">الكل</option><option value="cash">كاش</option><option value="visa">فيزا</option></select></div>
        <div class="full"><label for="fCat">النوع</label><select id="fCat"></select></div>
        <div class="full"><label for="fPeriod">الفترة</label>
          <select id="fPeriod"><option value="">كل الأوقات</option><option value="today">النهارده</option><option value="week">الأسبوع ده (من السبت)</option><option value="month">الشهر ده</option><option value="custom">من تاريخ لتاريخ</option></select></div>
        <div id="fDates" class="full grid" hidden style="padding:0">
          <div><label for="fFrom">من</label><input id="fFrom" type="date"></div>
          <div><label for="fTo">إلى</label><input id="fTo" type="date"></div>
        </div>
        <div><label for="fMin">المبلغ من</label><input id="fMin" type="text" inputmode="decimal" placeholder="0"></div>
        <div><label for="fMax">المبلغ إلى</label><input id="fMax" type="text" inputmode="decimal" placeholder="بدون حد"></div>
        <div class="full"><button id="fClear" class="btn" style="width:100%">مسح كل الفلاتر</button></div>
      </div>
    </div>

    <div id="list"></div>
  </section>

  <section id="v-sum" hidden>
    <div class="seg" id="sumMode" style="margin-bottom:12px"><button data-m="chart">الرسم البياني</button><button data-m="cats">حسب النوع</button></div>
    <div id="sumCats" hidden></div>
    <div id="sumChart">
    <div class="card">
      <div class="seg" id="sumType"><button data-v="expense" class="e">مصروفات</button><button data-v="income" class="i">دخل</button></div>
      <div class="fld"><label for="chartSel">شكل الرسم البياني</label>
        <select id="chartSel"><option value="pie">دائري</option><option value="bar">أعمدة</option><option value="line">خطي (على مدار الأيام)</option></select></div>
      <div id="sumNote" class="muted small" style="margin-top:8px"></div>
      <div id="chartBox" class="chartbox"><canvas id="cv"></canvas></div>
    </div>
    <div class="card" id="sumList"></div>
    </div>
  </section>

  <section id="v-calc" hidden></section>
  <section id="v-set" hidden></section>
</main>

<button id="fab" class="fab" aria-label="إضافة عملية">+</button>

<nav>
  <button data-tab="tx" class="on"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>العمليات</button>
  <button data-tab="sum"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>الملخص</button>
  <button data-tab="calc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>الحاسبة</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
</nav>

<div id="sheetWrap" class="overlay" hidden><div class="sheet" id="sheet"></div></div>
<div id="dlgWrap" class="overlay" hidden><div class="dlg" id="dlg"></div></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='masrofat_v1';
var PALETTE=['#0f766e','#2563eb','#d97706','#db2777','#7c3aed','#059669','#dc2626','#0891b2','#ca8a04','#4f46e5','#65a30d','#be185d'];
var $=function(s){return document.querySelector(s);};
var fmt=function(n){return new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n);};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);};
var pad=function(n){return String(n).padStart(2,'0');};
function normTime(v){var m=/^(\d{1,2}):(\d{2})/.exec(String(v==null?'':v).trim());if(!m)return '';var h=+m[1],mi=+m[2];if(h>23||mi>59)return '';return pad(h)+':'+pad(mi);}
function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function timeLabel(t){if(!t)return '';var h=+t.slice(0,2);return (h%12||12)+':'+t.slice(3,5)+' '+(h>=12?'م':'ص');}
function cmpTx(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.time||'')<(b.time||'')?-1:(a.time||'')>(b.time||'')?1:(a.ts-b.ts);}
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var toDate=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
var round2=function(x){return Math.round(x*100)/100;};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function parseNum(v){
  var s=String(v).trim().replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776;}).replace(/[٬,\s]/g,'').replace(/٫/g,'.');
  if(s===''||!/^-?\d*\.?\d+$/.test(s))return NaN;
  return parseFloat(s);
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function stripInvis(t){return String(t).replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff\u00a0]/g,function(c){return c==='\u00a0'?' ':'';});}
function extractJson(t){t=stripInvis(t);var i=t.indexOf('{'),j=t.lastIndexOf('}');return (i>=0&&j>i)?t.slice(i,j+1):null;}
function b64enc(str){var b=new TextEncoder().encode(str),bin='';for(var i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);return btoa(bin);}
function b64dec(b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function parseJsonLoose(raw){
  var o=null;
  try{o=JSON.parse(raw);}catch(e1){
    try{o=JSON.parse(raw.replace(/[“”„‟]/g,'"').replace(/[‘’]/g,"'"));}catch(e2){}
  }
  return o;
}
function decodeBackup(raw){
  var t=stripInvis(raw).trim(),mi=t.indexOf('MSRF1:'),body=null;
  if(mi>=0)body=t.slice(mi+6);
  else{var m0=t.match(/[A-Za-z0-9+\/]{80,}[=\s]*/);if(m0)body=m0[0];}
  if(body===null)return null;
  var m=body.match(/^[A-Za-z0-9+\/=\s]+/),b=m?m[0].replace(/\s/g,''):'';
  var k=b.indexOf('=');if(k>=0)b=b.slice(0,k);
  var len=b.length;
  while(b.length%4)b+='=';
  var js=null;
  try{js=b64dec(b);JSON.parse(js);}catch(err){js=null;}
  return {js:js,len:len,prefixed:mi>=0};
}
function analyzeText(raw){
  var t=stripInvis(raw).trim();
  if(!t)return {ok:false,msg:'لسه ما اتلصقش حاجة'};
  var d=decodeBackup(t);
  if(d){
    if(d.js){var s0=sanitize(JSON.parse(d.js));if(s0)return {ok:true,msg:'✓ رمز نسخة احتياطية سليم: '+s0.txs.length+' عملية، '+s0.cats.length+' نوع'};}
    else if(d.prefixed)return {ok:false,msg:'✗ الرمز ناقص أو اتقطع (اتقرا '+d.len+' حرف بس). انسخه كامل من نافذة التصدير.'};
  }
  if(t.indexOf('"txs"')>=0){
    var o=parseJsonLoose(extractJson(t)||t),s1=o&&sanitize(o);
    if(s1)return {ok:true,msg:'✓ JSON سليم: '+s1.txs.length+' عملية، '+s1.cats.length+' نوع'};
    return {ok:false,msg:'✗ JSON ناقص أو اتغيّر. استخدم رمز النسخة (MSRF1:) بدله.'};
  }
  var c=csvItems(t);
  if(c.items.length)return {ok:true,msg:'✓ CSV: '+c.items.length+' عملية صالحة'};
  return {ok:false,msg:'✗ النص اتقرا '+t.length+' حرف وبيبدأ بـ «'+t.slice(0,24)+'». الرمز الصح بيبدأ بـ MSRF1:'};
}
function importAnyText(raw){
  var t=stripInvis(raw).trim(),d=decodeBackup(t);
  if(d&&d.js){importJsonText(d.js);return;}
  if(d&&d.prefixed){toast('الرمز ناقص أو اتقطع (اتقرا '+d.len+' حرف بس). انسخه كامل من نافذة التصدير.');return;}
  if(t.indexOf('"txs"')>=0&&extractJson(t)){importJsonText(t);return;}
  importCsvText(t);
}

/* ---------- state ---------- */
function fresh(){return {v:1,initial:0,frozen:false,cats:[],txs:[],lastBackup:null,created:Date.now(),chart:'pie'};}
function sanitize(o){
  if(!o||typeof o!=='object')return null;
  var s=fresh();
  var ini=Number(o.initial);
  s.initial=isFinite(ini)?round2(ini):0;
  s.frozen=!!o.frozen;
  s.chart=['pie','bar','line'].indexOf(o.chart)>=0?o.chart:'pie';
  s.lastBackup=typeof o.lastBackup==='number'?o.lastBackup:null;
  s.created=typeof o.created==='number'?o.created:Date.now();
  var ids={};
  (Array.isArray(o.cats)?o.cats:[]).forEach(function(c){
    if(c&&typeof c.name==='string'&&c.name.trim()){
      var id=String(c.id||uid());
      if(!ids[id]){ids[id]=1;s.cats.push({id:id,name:c.name.trim().slice(0,40)});}
    }
  });
  (Array.isArray(o.txs)?o.txs:[]).forEach(function(t){
    if(!t)return;
    var amount=round2(Number(t.amount));
    if(!(amount>0))return;
    if(!ids[String(t.catId)])return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date)))return;
    s.txs.push({id:String(t.id||uid()),ts:Number(t.ts)||0,amount:amount,type:t.type==='income'?'income':'expense',catId:String(t.catId),method:t.method==='visa'?'visa':'cash',date:t.date,time:normTime(t.time),note:String(t.note||'').slice(0,200)});
  });
  return s;
}

/* ---------- helpers ---------- */
function balance(){var b=state.initial;state.txs.forEach(function(t){b+=t.type==='income'?t.amount:-t.amount;});return round2(b);}
function catName(id){var c=state.cats.find(function(x){return x.id===id;});return c?c.name:'—';}
function catColor(id){var i=state.cats.findIndex(function(x){return x.id===id;});return i<0?'#888':PALETTE[i%PALETTE.length];}
function dateLabel(d){
  var t=new Date();var td=ymd(t);t.setDate(t.getDate()-1);var yd=ymd(t);
  if(d===td)return 'النهارده';
  if(d===yd)return 'امبارح';
  try{return toDate(d).toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}
}
function range(){
  var t=new Date(),from='',to='';
  switch(filters.period){
    case 'today':from=to=ymd(t);break;
    case 'week':var d=new Date(t);d.setDate(d.getDate()-((d.getDay()+1)%7));from=ymd(d);d.setDate(d.getDate()+6);to=ymd(d);break;
    case 'month':from=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-01';to=ymd(new Date(t.getFullYear(),t.getMonth()+1,0));break;
    case 'custom':from=filters.from;to=filters.to;break;
  }
  return {from:from,to:to};
}
function getFiltered(){
  var r=range(),q=filters.search.toLowerCase();
  return state.txs.filter(function(t){
    if(filters.type&&t.type!==filters.type)return false;
    if(filters.method&&t.method!==filters.method)return false;
    if(filters.cat&&t.catId!==filters.cat)return false;
    if(r.from&&t.date<r.from)return false;
    if(r.to&&t.date>r.to)return false;
    if(filters.min!==null&&t.amount<filters.min)return false;
    if(filters.max!==null&&t.amount>filters.max)return false;
    if(q&&(t.note.toLowerCase().indexOf(q)<0&&catName(t.catId).toLowerCase().indexOf(q)<0))return false;
    return true;
  });
}
function activeCount(){
  var n=0;
  if(filters.search)n++;if(filters.type)n++;if(filters.method)n++;if(filters.cat)n++;if(filters.period)n++;
  if(filters.min!==null)n++;if(filters.max!==null)n++;
  return n;
}

function setupCanvas(h){
  var cv=$('#cv'),dpr=window.devicePixelRatio||1,w=cv.parentElement.clientWidth||300;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);

}
function short(v){return v>=1000?(v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,'')+'k':String(round2(v));}
function trunc(s,n){return s.length>n?s.slice(0,Math.max(1,n-1))+'…':s;}
function drawPie(rows,total){
  var o=setupCanvas(220),c=o.c,cx=o.w/2,cy=o.h/2,r=Math.min(o.w,o.h)/2-8,a=-Math.PI/2;
  rows.forEach(function(d){
    var ang=d.value/total*Math.PI*2;
    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,a,a+ang);c.closePath();
    c.fillStyle=d.color;c.fill();c.strokeStyle=css('--card');c.lineWidth=2;c.stroke();a+=ang;
  });
  c.beginPath();c.arc(cx,cy,r*0.58,0,Math.PI*2);c.fillStyle=css('--card');c.fill();
  c.fillStyle=css('--text');c.textAlign='center';c.textBaseline='middle';
  c.font='bold 16px system-ui, Tahoma, Arial, sans-serif';c.fillText(fmt(total),cx,cy-8);
  c.font='12px system-ui, Tahoma, Arial, sans-serif';c.fillStyle=css('--muted');c.fillText('ج.م',cx,cy+10);
}
function drawBars(rows){
  var o=setupCanvas(260),c=o.c,w=o.w,h=o.h,padT=24,padB=40,padX=8,n=rows.length;
  var max=Math.max.apply(null,rows.map(function(d){return d.value;}))||1;
  var slot=(w-padX*2)/n,bw=Math.min(52,slot*0.66);
  c.textAlign='center';
  rows.forEach(function(d,i){
    var x=w-padX-(i+0.5)*slot,bh=(h-padT-padB)*d.value/max;
    c.fillStyle=d.color;c.fillRect(x-bw/2,h-padB-bh,bw,bh);
    c.fillStyle=css('--text');c.textBaseline='bottom';c.fillText(short(d.value),x,h-padB-bh-3);
    c.fillStyle=css('--muted');c.textBaseline='top';c.fillText(trunc(d.label,Math.max(3,Math.floor(slot/7))),x,h-padB+8);
  });
  c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.moveTo(0,h-padB+.5);c.lineTo(w,h-padB+.5);c.stroke();
}
function dailySeries(txs){
  var m={};txs.forEach(function(t){m[t.date]=(m[t.date]||0)+t.amount;});
  var keys=Object.keys(m).sort();if(!keys.length)return [];
  var a=toDate(keys[0]),b=toDate(keys[keys.length-1]);
  var span=Math.round((b-a)/864e5);
  if(span<=62){var out=[];for(var d=new Date(a);d<=b;d.setDate(d.getDate()+1)){var k=ymd(d);out.push({date:k,value:round2(m[k]||0)});}return out;}
  return keys.map(function(k){return {date:k,value:round2(m[k])};});
}
function drawLine(days,color){
  var o=setupCanvas(240),c=o.c,w=o.w,h=o.h,pl=44,pr=14,pt=16,pb=28;
  var max=Math.max.apply(null,days.map(function(d){return d.value;}))||1;
  c.strokeStyle=css('--line');c.fillStyle=css('--muted');c.lineWidth=1;c.textAlign='right';c.textBaseline='middle';
  for(var g=0;g<=4;g++){
    var y=pt+(h-pt-pb)*g/4;
    c.beginPath();c.moveTo(pl,y+.5);c.lineTo(w-pr,y+.5);c.stroke();
    c.fillText(short(max*(4-g)/4),pl-6,y);
  }
  var n=days.length,xs=function(i){return n===1?(pl+w-pr)/2:pl+(w-pl-pr)*i/(n-1);},ys=function(v){return pt+(h-pt-pb)*(1-v/max);};
  if(n>1){
    c.beginPath();c.moveTo(xs(0),h-pb);days.forEach(function(d,i){c.lineTo(xs(i),ys(d.value));});c.lineTo(xs(n-1),h-pb);c.closePath();
    c.globalAlpha=.12;c.fillStyle=color;c.fill();c.globalAlpha=1;
    c.beginPath();days.forEach(function(d,i){if(i)c.lineTo(xs(i),ys(d.value));else c.moveTo(xs(i),ys(d.value));});
    c.strokeStyle=color;c.lineWidth=2;c.lineJoin='round';c.stroke();
  }
  if(n<=31)days.forEach(function(d,i){c.beginPath();c.arc(xs(i),ys(d.value),3,0,Math.PI*2);c.fillStyle=color;c.fill();});
  c.fillStyle=css('--muted');c.textBaseline='top';
  var lab=function(i,al){c.textAlign=al;c.fillText(days[i].date.slice(8,10)+'/'+days[i].date.slice(5,7),xs(i),h-pb+8);};
  lab(0,n===1?'center':'left');if(n>2)lab(Math.floor((n-1)/2),'center');if(n>1)lab(n-1,'right');
}
function renderCats(){
  var txs=getFiltered(),m={};
  state.cats.forEach(function(c){m[c.id]={id:c.id,e:0,i:0,n:0};});
  txs.forEach(function(t){var r=m[t.catId];if(!r)return;if(t.type==='income')r.i+=t.amount;else r.e+=t.amount;});
  var rows=Object.keys(m).map(function(k){var r=m[k];r.e=round2(r.e);r.i=round2(r.i);r.n=round2(r.i-r.e);return r;});
  rows.sort(function(a,b){return (b.e+b.i)-(a.e+a.i);});
  var te=0,ti=0;rows.forEach(function(r){te+=r.e;ti+=r.i;});te=round2(te);ti=round2(ti);
  var net=round2(ti-te),nf=activeCount();
  var sg=function(v){return (v>0?'+':'')+fmt(v);};
  var cls=function(v){return v<0?'exp':v>0?'inc':'';};
  var box=function(lbl,v,c,txt){return '<div><span class="muted">'+lbl+'</span><b class="'+c+'"><span class="num">'+txt+'</span></b></div>';};
  var h='<div class="card"><div class="muted small">'+(nf?'الأرقام حسب الفلاتر الحالية ('+nf+'). <a id="goF">تعديل</a> · <a id="clrF">مسح</a>':'الأرقام لكل العمليات. اضغط على أي نوع لعرض عملياته.')+'</div>'+
    '<h2 style="margin-top:10px">الإجمالي</h2><div class="tot">'+box('مصروف',te,'exp',fmt(te))+box('دخل',ti,'inc',fmt(ti))+box('صافي',net,cls(net),sg(net))+'</div>';
  if(!nf){
    h+='<div class="muted small" style="margin-top:10px">الرصيد الابتدائي: <span class="num">'+fmt(state.initial)+'</span> ج.م · الرصيد الحالي: <b class="'+(balance()<0?'exp':'')+'"><span class="num">'+fmt(balance())+'</span> ج.م</b></div>';
  }
  h+='<div class="muted small" style="margin-top:6px">رصيد النوع = دخله − مصروفه. الرصيد الابتدائي بيتحسب في الرصيد الحالي الإجمالي بس.</div></div>';
  if(!rows.length){h+='<div class="card empty">مفيش أنواع لسه. ضيف نوع من الإعدادات أو من إضافة عملية.</div>';}
  rows.forEach(function(r){
    var idle=!r.e&&!r.i;
    h+='<div class="card cat-card" data-id="'+esc(r.id)+'" style="cursor:pointer'+(idle?';opacity:.55':'')+'"><div class="cat" style="margin-bottom:8px"><span class="dot" style="background:'+catColor(r.id)+'"></span>'+esc(catName(r.id))+'</div>'+
      '<div class="tot">'+box('مصروف',r.e,'exp',fmt(r.e))+box('دخل',r.i,'inc',fmt(r.i))+box('الرصيد',r.n,cls(r.n),sg(r.n))+'</div></div>';
  });
  $('#sumCats').innerHTML=h;
}
function renderSummary(){
  var mode=ui.sumMode;
  document.querySelectorAll('#sumMode button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode);});
  $('#sumChart').hidden=mode==='cats';$('#sumCats').hidden=mode!=='cats';
  if(mode==='cats'){renderCats();return;}
  var type=ui.sumType;
  document.querySelectorAll('#sumType button').forEach(function(b){b.classList.toggle('on',b.dataset.v===type);});
  $('#chartSel').value=state.chart;
  var n=activeCount();
  $('#sumNote').innerHTML=n?'الملخص حسب الفلاتر الحالية ('+n+'). <a id="goF">تعديل</a> · <a id="clrF">مسح</a>':'الملخص لكل العمليات. الفلاتر من تاب العمليات.';
  var txs=getFiltered().filter(function(t){return t.type===type;});
  var by={};txs.forEach(function(t){by[t.catId]=(by[t.catId]||0)+t.amount;});
  var rows=Object.keys(by).map(function(id){return {label:catName(id),value:round2(by[id]),color:catColor(id)};}).sort(function(a,b){return b.value-a.value;});
  var total=round2(rows.reduce(function(s,r){return s+r.value;},0));
  var box=$('#chartBox'),lst=$('#sumList');
  if(!rows.length){box.hidden=true;lst.innerHTML='<div class="empty">مفيش '+(type==='income'?'دخل':'مصروفات')+' في الفترة/الفلاتر دي.</div>';return;}
  box.hidden=false;
  var crow=rows;
  if(rows.length>8){var rest=rows.slice(8).reduce(function(s,r){return s+r.value;},0);crow=rows.slice(0,8).concat([{label:'أخرى',value:round2(rest),color:'#888'}]);}
  if(state.chart==='pie')drawPie(crow,total);
  else if(state.chart==='bar')drawBars(crow);
  else drawLine(dailySeries(txs),type==='income'?css('--inc'):css('--exp'));
  lst.innerHTML='<h2>'+(type==='income'?'الدخل':'المصروفات')+' حسب النوع — <span class="num">'+fmt(total)+'</span> ج.م</h2>'+rows.map(function(r){
    var p=total?r.value/total*100:0;
    return '<div class="srow"><span class="dot" style="background:'+r.color+'"></span><div class="nm"><div>'+esc(r.label)+'</div><div class="bar"><i style="width:'+p.toFixed(1)+'%;background:'+r.color+'"></i></div></div><div style="text-align:left"><b><span class="num">'+fmt(r.value)+'</span></b><div class="muted small"><span class="num">'+p.toFixed(1)+'%</span></div></div></div>';
  }).join('');
}

/* ---------- calculator tab ---------- */
var calc={toks:[],cur:'0',fresh:false,err:false,last:''};
var OPS={'+':'+','-':'−','*':'×','/':'÷'};
function dispNum(s){
  if(s===''||s==null)return '';
  var neg=s.charAt(0)==='-',b=neg?s.slice(1):s;
  if(/e/i.test(b))return s;
  var i=b.indexOf('.'),ip=i<0?b:b.slice(0,i),fp=i<0?'':b.slice(i);
  return (neg?'−':'')+ip.replace(/\B(?=(\d{3})+(?!\d))/g,',')+fp;
}
function calcText(list){return list.map(function(x){return OPS[x]||dispNum(x);}).join(' ');}
function calcEval(list){
  var a=[list[0]],i,x,op,y;
  for(i=1;i<list.length;i+=2){
    op=list[i];y=parseFloat(list[i+1]);
    if(op==='*'||op==='/'){
      x=parseFloat(a.pop());
      if(op==='/'&&y===0)return null;
      a.push(String(op==='*'?x*y:x/y));
    }else{a.push(op);a.push(String(y));}
  }
  var r=parseFloat(a[0]);
  for(i=1;i<a.length;i+=2){r=a[i]==='+'?r+parseFloat(a[i+1]):r-parseFloat(a[i+1]);}
  if(!isFinite(r))return null;
  r=parseFloat(r.toPrecision(12));
  return r===0?'0':String(r);
}
function calcPress(k){
  var c=calc,isOp=!!OPS[k],isDig=/^[0-9]$/.test(k);
  if(c.err){
    c.toks=[];c.cur='0';c.err=false;c.fresh=false;c.last='';
    if(!isDig&&k!=='.'){renderCalc();return;}
  }
  if(isDig){
    if(c.fresh){c.cur='0';c.toks=[];c.fresh=false;}
    if(c.cur==='0')c.cur=k;
    else if(c.cur.replace(/[-.]/g,'').length<15)c.cur+=k;
  }else if(k==='.'){
    if(c.fresh){c.cur='0';c.toks=[];c.fresh=false;}
    if(c.cur==='')c.cur='0';
    if(c.cur.indexOf('.')<0)c.cur+='.';
  }else if(isOp){
    if(c.cur!==''){
      if(c.fresh){c.toks=[];c.fresh=false;}
      c.toks.push(c.cur.replace(/\.$/,''));c.toks.push(k);c.cur='';
    }else if(c.toks.length)c.toks[c.toks.length-1]=k;
  }else if(k==='='){
    var list=c.toks.slice();
    if(c.cur!=='')list.push(c.cur.replace(/\.$/,''));else if(list.length)list.pop();
    if(list.length<3){renderCalc();return;}
    var r=calcEval(list);
    c.last=calcText(list)+' =';c.toks=[];
    if(r===null){c.err=true;c.cur='0';}else{c.cur=r;c.fresh=true;}
  }else if(k==='B'){
    if(c.fresh){renderCalc();return;}
    if(c.cur===''){c.toks.pop();c.cur=c.toks.pop()||'0';}
    else{c.cur=c.cur.slice(0,-1);if(c.cur===''||c.cur==='-')c.cur=c.toks.length?'':'0';}
  }else if(k==='C'){
    calc={toks:[],cur:'0',fresh:false,err:false,last:''};
  }
  renderCalc();
}
function renderCalc(){
  var v=$('#v-calc');
  if(!v.firstChild){
    var rows=[['C','fn','C'],['B','fn','⌫'],['/','op','÷'],['*','op','×'],
      ['7','','7'],['8','','8'],['9','','9'],['-','op','−'],
      ['4','','4'],['5','','5'],['6','','6'],['+','op','+'],
      ['1','','1'],['2','','2'],['3','','3'],['=','eq','='],
      ['0','z','0'],['.','','.']];
    v.innerHTML='<div class="calc" dir="ltr"><div class="cdisp"><div class="cexp" id="calcExp"></div><div class="cmain" id="calcMain"></div></div>'+
      '<div class="cgrid" id="calcGrid">'+rows.map(function(r){return '<button type="button" data-k="'+r[0]+'" class="'+r[1]+'">'+r[2]+'</button>';}).join('')+'</div></div>';
  }
  var c=calc,exp,main;
  if(c.err){exp=c.last;main='مش ممكن';}
  else if(c.fresh){exp=c.last;main=dispNum(c.cur);}
  else{
    exp=calcText(c.toks);
    main=c.cur!==''?dispNum(c.cur):dispNum(c.toks[c.toks.length-2]);
  }
  $('#calcExp').textContent=exp;
  var m=$('#calcMain');m.textContent=main;
  m.style.color=c.err?'var(--danger)':'';
  var n=main.length;m.style.fontSize=(c.err?32:n<=9?44:n<=12?36:n<=15?28:22)+'px';
  m.scrollLeft=m.scrollWidth;
}
/* الضغط يتسجل لحظة اللمس (pointerdown) من غير انتظار الـ click. الـ click بيتعامل معاه بس لو جه من كيبورد أو قارئ شاشة (detail=0) */
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('#calcGrid button');
  if(!b||(e.pointerType==='mouse'&&e.button!==0))return;
  e.preventDefault();
  calcPress(b.dataset.k);
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('#calcGrid button');
  if(b&&e.detail===0)calcPress(b.dataset.k);
});
document.addEventListener('keydown',function(e){
  if(ui.tab!=='calc'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!$('#sheetWrap').hidden||!$('#dlgWrap').hidden)return;
  var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  var k=e.key,m=null;
  if(/^[0-9]$/.test(k))m=k;
  else if(k==='.'||k===',')m='.';
  else if(k==='+'||k==='-'||k==='*'||k==='/')m=k;
  else if(k==='Enter'||k==='=')m='=';
  else if(k==='Backspace')m='B';
  else if(k==='Escape'||k==='Delete')m='C';
  if(m){e.preventDefault();calcPress(m);}
});

$('#v-set').addEventListener('change',function(e){
  if(e.target.id==='initIn'){
    var v=parseNum(e.target.value);
    if(isNaN(v)){e.target.value=state.initial;return;}
    if(round2(v)===state.initial)return;
    mutate(function(){state.initial=round2(v);},'تم تعديل الرصيد الابتدائي');
  }else if(e.target.id==='frozenChk'){
    var f=e.target.checked;
    mutate(function(){state.frozen=f;},f?'تم تجميد الرصيد الابتدائي':'تم فك التجميد');
  }else if(e.target.id==='fileJson'){importJson(e.target.files[0]);e.target.value='';}
  else if(e.target.id==='fileCsv'){importCsv(e.target.files[0]);e.target.value='';}
});
$('#v-set').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var row=b.closest('.crow');
  if(row){
    var id=row.dataset.id,c=state.cats.find(function(x){return x.id===id;});if(!c)return;
    if(b.dataset.a==='ren'){
      askText('اسم النوع',c.name).then(function(v){
        if(v===null||!v||v===c.name)return;
        if(state.cats.some(function(x){return x.id!==id&&x.name.toLowerCase()===v.toLowerCase();})){toast('النوع ده موجود بالفعل');return;}
        mutate(function(){c.name=v.slice(0,40);},'تم تعديل النوع');
      });
    }else if(b.dataset.a==='del'){
      var cnt=state.txs.filter(function(t){return t.catId===id;}).length;
      ask(cnt?'هيتحذف النوع "'+c.name+'" و '+cnt+' عملية معاه، والرصيد هيتغير. متأكد؟':'هيتحذف النوع "'+c.name+'". متأكد؟','حذف').then(function(ok){
        if(!ok)return;
        mutate(function(){state.cats=state.cats.filter(function(x){return x.id!==id;});state.txs=state.txs.filter(function(t){return t.catId!==id;});},'تم حذف النوع');
      });
    }
    return;
  }
  switch(b.id){
    case 'addCatS':{
      var inp=$('#newCatS'),nm=inp.value.trim();if(!nm)return;
      if(state.cats.some(function(x){return x.name.toLowerCase()===nm.toLowerCase();})){toast('النوع ده موجود بالفعل');return;}
      addCat(nm);break;}
    case 'expJson':exportJson();break;
    case 'expCsv':exportCsv();break;
    case 'impJson':$('#fileJson').click();break;
    case 'impCsv':$('#fileCsv').click();break;
    case 'impPaste':showPasteImport();break;
    case 'wipe':
      ask('هيتمسح كل شي: العمليات والأنواع والرصيد الابتدائي. متأكد؟','مسح الكل').then(function(ok){
        if(!ok)return;mutate(function(){var f=fresh();f.lastBackup=state.lastBackup;state=f;},'تم مسح كل البيانات');
      });
      break;
  }
});

/* ---------- backup ---------- */
function download(name,mime,content){
  var b=new Blob([content],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function markBackup(){state.lastBackup=Date.now();save();renderChrome();if(ui.tab==='set')renderSettings();}
function copyText(text,ta){
  return new Promise(function(res){
    function legacy(){
      var ok=false,ro=ta.readOnly;
      try{ta.readOnly=false;ta.focus();ta.select();ta.setSelectionRange(0,text.length);ok=document.execCommand('copy');}catch(err){}
      ta.readOnly=ro;
      res(ok);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){res(true);},legacy);}
    else legacy();
  });
}
function showExport(name,mime,content,label,dlContent){
  var dlg=$('#dlg');
  dlg.innerHTML='<p><b>'+esc(label)+'</b><br><span class="muted small">انسخ النص واحفظه في تطبيق الملاحظات أو ابعته لنفسك. لاسترجاعه استخدم "استيراد بلصق نص" من الإعدادات.</span><br><span class="muted small">الطول: '+content.length+' حرف</span></p><textarea id="exTxt" readonly></textarea><div class="btns" style="flex-wrap:wrap"><button class="btn primary" data-a="copy">نسخ</button>'+(navigator.share?'<button class="btn" data-a="share">مشاركة</button>':'')+'<button class="btn" data-a="dl">تنزيل كملف</button><button class="btn" data-a="x">إغلاق</button></div>';
  $('#exTxt').value=content;
  $('#dlgWrap').hidden=false;
  dlg.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    var a=b.dataset.a;
    if(a==='x'){$('#dlgWrap').hidden=true;return;}
    if(a==='copy'){
      var ta=$('#exTxt');
      copyText(content,ta).then(function(ok){
        if(ok){markBackup();toast('تم نسخ النص كامل ('+content.length+' حرف)');}
        else{ta.focus();ta.select();ta.setSelectionRange(0,content.length);toast('النسخ التلقائي مش متاح هنا. النص اتحدد كله، اضغط عليه واختار نسخ.');}
      });
    }else if(a==='share'){
      navigator.share({title:name,text:content}).then(function(){markBackup();}).catch(function(){});
    }else if(a==='dl'){
      download(name,mime,dlContent||content);markBackup();
    }
  };
}
function showPasteImport(){
  var dlg=$('#dlg');
  dlg.innerHTML='<p><b>استيراد بلصق نص</b><br><span class="muted small">الصق رمز النسخة الاحتياطية (بيبدأ بـ MSRF1:) أو نص JSON أو CSV.</span></p><textarea id="pasteTxt" placeholder="الصق هنا..."></textarea><div class="muted small" id="pasteInfo">لسه ما اتلصقش حاجة</div><div class="btns"><button class="btn" data-r="0">إلغاء</button><button class="btn primary" data-r="1">استيراد</button></div>';
  $('#dlgWrap').hidden=false;
  $('#pasteTxt').addEventListener('input',function(){var r=analyzeText(this.value),el=$('#pasteInfo');el.textContent=r.msg;el.style.color=r.ok?'var(--inc)':(this.value.trim()?'var(--exp)':'');});
  dlg.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    var t=$('#pasteTxt').value;
    $('#dlgWrap').hidden=true;
    if(b.dataset.r!=='1'||!t.trim())return;
    importAnyText(t);
  };
}
function exportJson(){
  var js=JSON.stringify({app:'masrofat',exported:new Date().toISOString(),initial:state.initial,frozen:state.frozen,cats:state.cats,txs:state.txs,chart:state.chart,created:state.created},null,1);
  showExport('masrofat-'+ymd(new Date())+'.json','application/json','MSRF1:'+b64enc(js),'رمز النسخة الاحتياطية',js);
}
function exportCsv(){
  var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';};
  var rows=['التاريخ,العملية,النوع,المبلغ,الدفع,الملاحظة,الوقت'];
  state.txs.slice().sort(cmpTx).forEach(function(t){
    rows.push([t.date,t.type==='income'?'دخل':'مصروف',q(catName(t.catId)),t.amount,t.method==='visa'?'فيزا':'كاش',q(t.note),t.time||''].join(','));
  });
  showExport('masrofat-'+ymd(new Date())+'.csv','text/csv;charset=utf-8',rows.join('\r\n'),'نسخة CSV (تفتح في إكسل)');
}
function importJson(file){if(file)file.text().then(importAnyText);}
function importCsv(file){if(file)file.text().then(importCsvText);}
async function importJsonText(text){
  var o=parseJsonLoose(extractJson(text)||String(text));
  if(!o){toast('النص مش JSON سليم. غالبًا اتقطع أثناء النسخ أو علامات التنصيص اتغيّرت. انسخ النص كامل من أول { لآخر } من نافذة التصدير.');return;}
  var s=sanitize(o);
  if(!s||(!s.cats.length&&!s.txs.length&&!s.initial)){toast('النسخة فاضية أو مش بالشكل المتوقع (مفيش أنواع ولا عمليات).');return;}
  var ok=await ask('هيتم استبدال كل البيانات الحالية بالنسخة دي ('+s.txs.length+' عملية، '+s.cats.length+' نوع). تكمل؟','استبدال');
  if(!ok)return;
  mutate(function(){state=s;},'تم استيراد النسخة الاحتياطية');
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim()!=='';});});
}
function csvItems(text){
  text=stripInvis(text).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776;});
  var rows=parseCSV(text),items=[];
  rows.forEach(function(r){
    if(r.length<4)return;
    var date=r[0].trim().replace(/\//g,'-');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
    var cat=(r[2]||'').trim(),amount=parseNum(r[3]);
    if(!cat||!(amount>0))return;
    items.push({date:date,type:/دخل|income/i.test(r[1])?'income':'expense',cat:cat,amount:round2(amount),method:/فيزا|visa/i.test(r[4]||'')?'visa':'cash',note:(r[5]||'').trim().slice(0,200),time:normTime(r[6])});
  });
  return {rows:rows,items:items};
}
async function importCsvText(text){
  if(!text)return;
  var r=csvItems(text),items=r.items;
  if(!items.length){toast('مفيش عمليات صالحة في النص (قرأت '+r.rows.length+' سطر). لو النص رمز نسخة احتياطية لازم يبدأ بـ MSRF1:');return;}
  var ok=await ask('هتتضاف '+items.length+' عملية على اللي عندك. تكمل؟','إضافة',false);
  if(!ok)return;
  mutate(function(){
    items.forEach(function(it){
      var c=state.cats.find(function(x){return x.name.toLowerCase()===it.cat.toLowerCase();});
      if(!c){c={id:uid(),name:it.cat.slice(0,40)};state.cats.push(c);}
      state.txs.push({id:uid(),ts:Date.now(),amount:it.amount,type:it.type,catId:c.id,method:it.method,date:it.date,time:it.time||'',note:it.note});
    });
  },'تم استيراد '+items.length+' عملية');
}
